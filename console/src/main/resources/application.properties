spring.application.name=newsflow-console
server.port=8081
spring.web.error.include-message=always

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/newsflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.com.yifan.newsflow.module.mapper=debug
